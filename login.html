<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | A+Connect</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .login-card {
      background: white;
      max-width: 400px;
      width: 90%;
      padding: 2rem;
      border-radius: 32px;
      box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
    }
    .login-card h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #1e293b;
    }
    .login-card input {
      width: 100%;
      padding: 0.8rem;
      margin: 0.5rem 0;
      border-radius: 40px;
      border: 1px solid #cbd5e1;
    }
    .login-card button {
      width: 100%;
      background: #1e293b;
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
    }
    .message {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.8rem;
      color: #c2410c;
    }
  </style>
</head>
<body>
<div class="login-card">
  <h2><i class="fas fa-lock"></i> A+Connect Admin</h2>
  <input type="email" id="email" placeholder="Email address">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">Sign In</button>
  <div id="message" class="message"></div>
</div>

<script>
  const SUPABASE_URL = 'https://sdrwdvvrojhhxnyydsao.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkcndkdnZyb2poaHhueXlkc2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODQ3MTYsImV4cCI6MjA5NTQ2MDcxNn0.M67nknliCzw3EcfHM5EhbSxan1gedDmOVwsWOK4sYMM';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const msgDiv = document.getElementById('message');
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      msgDiv.innerText = error.message;
    } else {
      window.location.href = 'dashboard.html';
    }
  });
</script>
</body>
</html>
