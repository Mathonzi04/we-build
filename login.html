<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | CodeCrafted</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e2a47, #2c5282);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
        }
        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo i {
            font-size: 2.5rem;
            color: #1e2a47;
        }
        .logo h2 {
            margin-top: 0.5rem;
            color: #1e2a47;
        }
        .input-group {
            margin-bottom: 1.2rem;
        }
        .input-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.3rem;
        }
        .input-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #cbd5e0;
            border-radius: 1rem;
            font-size: 0.9rem;
        }
        .btn-login {
            background: #1e2a47;
            color: white;
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 2rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .forgot-link {
            text-align: right;
            margin-top: 0.8rem;
        }
        .forgot-link button {
            background: none;
            border: none;
            color: #2c5282;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .error-msg {
            color: #e53e3e;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.8rem;
        }
        .success-msg {
            color: #2f855a;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.8rem;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-card {
            background: white;
            max-width: 350px;
            width: 90%;
            border-radius: 1.5rem;
            padding: 1.5rem;
            text-align: center;
        }
        .modal-card input {
            width: 100%;
            padding: 0.7rem;
            margin: 1rem 0;
            border: 1px solid #cbd5e0;
            border-radius: 1rem;
        }
        .modal-buttons {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <i class="fas fa-store"></i>
            <h2>Admin Login</h2>
            <p>CodeCrafted Dashboard</p>
        </div>
        <div class="input-group">
            <label><i class="fas fa-envelope"></i> Email</label>
            <input type="email" id="email" placeholder="admin@example.com">
        </div>
        <div class="input-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button id="loginBtn" class="btn-login"><i class="fas fa-sign-in-alt"></i> Login</button>
        <div class="forgot-link">
            <button id="forgotBtn"><i class="fas fa-key"></i> Forgot password?</button>
        </div>
        <div id="message"></div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotModal" class="modal">
        <div class="modal-card">
            <i class="fas fa-paper-plane" style="font-size: 2rem;"></i>
            <h3>Reset Password</h3>
            <input type="email" id="resetEmail" placeholder="Your email">
            <div class="modal-buttons">
                <button id="sendResetBtn" style="background:#1e2a47; color:white;">Send</button>
                <button id="cancelResetBtn">Cancel</button>
            </div>
            <div id="resetMessage"></div>
        </div>
    </div>

    <script>
        (function() {
            const SUPABASE_URL = 'https://sdrwdvvrojhhxnyydsao.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkcndkdnZyb2poaHhueXlkc2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODQ3MTYsImV4cCI6MjA5NTQ2MDcxNn0.M67nknliCzw3EcfHM5EhbSxan1gedDmOVwsWOK4sYMM';
            const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const DASHBOARD_URL = 'dashboard.html';

            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const loginBtn = document.getElementById('loginBtn');
            const messageDiv = document.getElementById('message');
            const forgotBtn = document.getElementById('forgotBtn');
            const forgotModal = document.getElementById('forgotModal');
            const resetEmail = document.getElementById('resetEmail');
            const sendResetBtn = document.getElementById('sendResetBtn');
            const cancelResetBtn = document.getElementById('cancelResetBtn');
            const resetMessage = document.getElementById('resetMessage');

            async function handleLogin() {
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                if (!email || !password) {
                    messageDiv.innerHTML = '<div class="error-msg">Email and password required</div>';
                    return;
                }
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Logging in...';
                const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                if (error) {
                    messageDiv.innerHTML = `<div class="error-msg">${error.message}</div>`;
                    return;
                }
                if (data.session) {
                    window.location.href = DASHBOARD_URL;
                }
            }

            async function sendReset() {
                const email = resetEmail.value.trim();
                if (!email) {
                    resetMessage.innerHTML = '<div class="error-msg">Enter email</div>';
                    return;
                }
                sendResetBtn.disabled = true;
                sendResetBtn.innerHTML = 'Sending...';
                const { error } = await _supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + window.location.pathname,
                });
                sendResetBtn.disabled = false;
                sendResetBtn.innerHTML = 'Send';
                if (error) {
                    resetMessage.innerHTML = `<div class="error-msg">${error.message}</div>`;
                } else {
                    resetMessage.innerHTML = '<div class="success-msg">Reset link sent! Check your email.</div>';
                    setTimeout(() => {
                        forgotModal.style.display = 'none';
                        resetEmail.value = '';
                        resetMessage.innerHTML = '';
                    }, 2000);
                }
            }

            loginBtn.addEventListener('click', handleLogin);
            passwordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
            forgotBtn.addEventListener('click', () => { forgotModal.style.display = 'flex'; });
            cancelResetBtn.addEventListener('click', () => { forgotModal.style.display = 'none'; });
            sendResetBtn.addEventListener('click', sendReset);
            window.onclick = (e) => { if (e.target === forgotModal) forgotModal.style.display = 'none'; };

            // Handle password reset recovery (if user clicks reset link)
            async function handleRecovery() {
                const hash = window.location.hash;
                if (hash && hash.includes('type=recovery')) {
                    const newPwd = prompt('Enter your new password (min 6 characters):');
                    if (newPwd && newPwd.length >= 6) {
                        const { error } = await _supabase.auth.updateUser({ password: newPwd });
                        if (error) alert('Error: ' + error.message);
                        else {
                            alert('Password updated! Please login with new password.');
                            window.location.hash = '';
                        }
                    } else if (newPwd) {
                        alert('Password must be at least 6 characters.');
                    }
                }
            }
            handleRecovery();
        })();
    </script>
</body>
</html>
