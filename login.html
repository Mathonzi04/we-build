<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | CodeCrafted</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f0f4fa 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .login-container, .reset-container {
            max-width: 450px;
            width: 100%;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        .brand {
            background: #1e2a47;
            padding: 1.8rem;
            text-align: center;
            color: white;
        }
        .brand i {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }
        .brand h2 {
            font-weight: 600;
        }
        .form-panel {
            padding: 2rem 1.8rem;
        }
        .input-group {
            margin-bottom: 1.3rem;
        }
        .input-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.4rem;
            color: #1f2937;
        }
        .input-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 1rem;
            font-size: 0.95rem;
        }
        .input-group input:focus {
            outline: none;
            border-color: #1e2a47;
            box-shadow: 0 0 0 3px rgba(30,42,71,0.15);
        }
        .btn-primary {
            background: #1e2a47;
            color: white;
            border: none;
            width: 100%;
            padding: 0.9rem;
            font-weight: 600;
            border-radius: 2rem;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }
        .btn-primary:hover {
            background: #0f1a30;
        }
        .forgot-row {
            text-align: right;
            margin-top: 0.8rem;
        }
        .forgot-link {
            background: none;
            border: none;
            color: #1e2a47;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 500;
        }
        .error-msg {
            color: #dc2626;
            font-size: 0.8rem;
            margin-top: 0.7rem;
            text-align: center;
            background: #fee2e2;
            padding: 0.5rem;
            border-radius: 1rem;
        }
        .success-msg {
            color: #15803d;
            background: #dcfce7;
            padding: 0.5rem;
            border-radius: 1rem;
            margin-top: 0.7rem;
            text-align: center;
        }
        .dashboard {
            display: none;
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            text-align: center;
        }
        .logout-btn {
            background: #e5e7eb;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 2rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 1.5rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-card {
            background: white;
            max-width: 400px;
            width: 90%;
            border-radius: 1.5rem;
            padding: 1.8rem;
            text-align: center;
        }
        .modal-buttons {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
        }
        .modal-buttons button {
            flex: 1;
            padding: 0.7rem;
            border-radius: 2rem;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }
        footer {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.7rem;
            color: #6b7280;
            padding-bottom: 1rem;
        }
        .reset-container {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Normal Login Card -->
    <div id="loginCard" class="login-container">
        <div class="brand">
            <i class="fas fa-store"></i>
            <h2>CodeCrafted Admin</h2>
            <p>Sign in to manage templates & orders</p>
        </div>
        <div class="form-panel">
            <div class="input-group">
                <label><i class="fas fa-envelope"></i> Email address</label>
                <input type="email" id="adminEmail" placeholder="admin@yourstore.com">
            </div>
            <div class="input-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="adminPassword" placeholder="••••••••">
            </div>
            <button id="loginBtn" class="btn-primary"><i class="fas fa-sign-in-alt"></i> Login</button>
            <div class="forgot-row">
                <button id="forgotBtn" class="forgot-link"><i class="fas fa-key"></i> Forgot password?</button>
            </div>
            <div id="loginMessage"></div>
        </div>
        <footer>Protected area – Admin only</footer>
    </div>

    <!-- Password Reset Card (shown when recovery hash is present) -->
    <div id="resetCard" class="reset-container">
        <div class="brand">
            <i class="fas fa-lock-reset"></i>
            <h2>Set New Password</h2>
            <p>Enter your new password below</p>
        </div>
        <div class="form-panel">
            <div class="input-group">
                <label><i class="fas fa-key"></i> New password</label>
                <input type="password" id="newPassword" placeholder="At least 6 characters">
            </div>
            <div class="input-group">
                <label><i class="fas fa-check-circle"></i> Confirm password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password">
            </div>
            <button id="resetPasswordBtn" class="btn-primary"><i class="fas fa-save"></i> Update Password</button>
            <div id="resetMessage"></div>
            <div class="forgot-row">
                <button id="backToLoginFromReset" class="forgot-link"><i class="fas fa-arrow-left"></i> Back to login</button>
            </div>
        </div>
    </div>

    <!-- Dashboard after login -->
    <div id="dashboard" class="dashboard">
        <i class="fas fa-chalkboard-user" style="font-size: 3rem; color: #1e2a47;"></i>
        <h2 style="margin: 1rem 0;">Welcome, <span id="adminEmailDisplay"></span></h2>
        <p>You are now logged in as administrator.</p>
        <button id="logoutDashboardBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <!-- Forgot Password Modal (send reset email) -->
    <div id="forgotModal" class="modal">
        <div class="modal-card">
            <h3><i class="fas fa-paper-plane"></i> Reset password</h3>
            <p>Enter your email to receive a reset link</p>
            <input type="email" id="resetEmail" placeholder="admin@example.com">
            <div class="modal-buttons">
                <button id="sendResetBtn" class="btn-primary" style="background:#1e2a47;"><i class="fas fa-envelope"></i> Send</button>
                <button id="cancelModalBtn" style="background:#e5e7eb;">Cancel</button>
            </div>
            <div id="modalMessage"></div>
        </div>
    </div>

    <script>
        // Supabase config
        const SUPABASE_URL = 'https://sdrwdvvrojhhxnyydsao.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkcndkdnZyb2poaHhueXlkc2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODQ3MTYsImV4cCI6MjA5NTQ2MDcxNn0.M67nknliCzw3EcfHM5EhbSxan1gedDmOVwsWOK4sYMM';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // DOM elements
        const loginCard = document.getElementById('loginCard');
        const resetCard = document.getElementById('resetCard');
        const dashboardDiv = document.getElementById('dashboard');
        const adminEmailInput = document.getElementById('adminEmail');
        const adminPasswordInput = document.getElementById('adminPassword');
        const loginBtn = document.getElementById('loginBtn');
        const loginMessageDiv = document.getElementById('loginMessage');
        const forgotBtn = document.getElementById('forgotBtn');
        const forgotModal = document.getElementById('forgotModal');
        const resetEmailInput = document.getElementById('resetEmail');
        const sendResetBtn = document.getElementById('sendResetBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const modalMessageDiv = document.getElementById('modalMessage');
        const logoutDashboardBtn = document.getElementById('logoutDashboardBtn');
        const adminEmailDisplay = document.getElementById('adminEmailDisplay');
        
        // Reset card elements
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const resetPasswordBtn = document.getElementById('resetPasswordBtn');
        const resetMessageDiv = document.getElementById('resetMessage');
        const backToLoginFromReset = document.getElementById('backToLoginFromReset');

        function showLoginMessage(msg, isError = true) {
            loginMessageDiv.innerHTML = `<div class="${isError ? 'error-msg' : 'success-msg'}"><i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${msg}</div>`;
            setTimeout(() => { if (loginMessageDiv.firstChild) loginMessageDiv.innerHTML = ''; }, 4000);
        }

        function showResetMessage(msg, isError = true) {
            resetMessageDiv.innerHTML = `<div class="${isError ? 'error-msg' : 'success-msg'}">${msg}</div>`;
            setTimeout(() => { if (resetMessageDiv.firstChild) resetMessageDiv.innerHTML = ''; }, 4000);
        }

        function showModalMessage(msg, isError = true) {
            modalMessageDiv.innerHTML = `<div style="color:${isError ? '#dc2626' : '#15803d'}; font-size:0.8rem; margin-top:0.8rem;">${msg}</div>`;
            setTimeout(() => { if (modalMessageDiv.firstChild) modalMessageDiv.innerHTML = ''; }, 4000);
        }

        // Login handler
        async function handleLogin() {
            const email = adminEmailInput.value.trim();
            const password = adminPasswordInput.value;
            if (!email || !password) {
                showLoginMessage('Email and password are required', true);
                return;
            }
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Authenticating...';
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
            if (error) {
                showLoginMessage(error.message, true);
                return;
            }
            if (data.session) {
                loginCard.style.display = 'none';
                dashboardDiv.style.display = 'block';
                adminEmailDisplay.textContent = data.session.user.email;
                adminEmailInput.value = '';
                adminPasswordInput.value = '';
            } else {
                showLoginMessage('Login failed', true);
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            loginCard.style.display = 'block';
            dashboardDiv.style.display = 'none';
            resetCard.style.display = 'none';
            adminEmailInput.value = '';
            adminPasswordInput.value = '';
            showLoginMessage('Logged out successfully', false);
        }

        // Forgot password: send reset email
        async function sendResetEmail() {
            const email = resetEmailInput.value.trim();
            if (!email) {
                showModalMessage('Please enter your email address', true);
                return;
            }
            sendResetBtn.disabled = true;
            sendResetBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Sending...';
            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + window.location.pathname,
            });
            sendResetBtn.disabled = false;
            sendResetBtn.innerHTML = '<i class="fas fa-envelope"></i> Send';
            if (error) {
                showModalMessage(error.message, true);
            } else {
                showModalMessage('Password reset link sent! Check your inbox.', false);
                setTimeout(() => {
                    forgotModal.style.display = 'none';
                    resetEmailInput.value = '';
                }, 2000);
            }
        }

        // Handle password reset (when user clicks link from email)
        async function handleRecoveryMode() {
            // Check if URL contains recovery hash
            const hash = window.location.hash;
            if (hash && hash.includes('type=recovery')) {
                // Hide login card, show reset card
                loginCard.style.display = 'none';
                resetCard.style.display = 'block';
                dashboardDiv.style.display = 'none';
                // Clear any previous messages
                resetMessageDiv.innerHTML = '';
                // Also, we need to ensure Supabase session is established with the recovery token
                // Supabase automatically exchanges the hash tokens, we just need to get the session
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                if (error || !session) {
                    showResetMessage('Invalid or expired reset link. Please request a new one.', true);
                } else {
                    // We have a valid session in recovery mode, ready to update password
                    console.log('Recovery session active');
                }
            }
        }

        // Update password after reset
        async function updatePassword() {
            const newPwd = newPasswordInput.value;
            const confirmPwd = confirmPasswordInput.value;
            if (!newPwd || !confirmPwd) {
                showResetMessage('Please fill both password fields', true);
                return;
            }
            if (newPwd.length < 6) {
                showResetMessage('Password must be at least 6 characters', true);
                return;
            }
            if (newPwd !== confirmPwd) {
                showResetMessage('Passwords do not match', true);
                return;
            }
            resetPasswordBtn.disabled = true;
            resetPasswordBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Updating...';
            const { error } = await supabaseClient.auth.updateUser({ password: newPwd });
            resetPasswordBtn.disabled = false;
            resetPasswordBtn.innerHTML = '<i class="fas fa-save"></i> Update Password';
            if (error) {
                showResetMessage(error.message, true);
                return;
            }
            showResetMessage('Password updated successfully! Redirecting to login...', false);
            // Sign out to clear recovery session
            await supabaseClient.auth.signOut();
            // Clear URL hash
            window.location.hash = '';
            // Redirect to login after 2 seconds
            setTimeout(() => {
                resetCard.style.display = 'none';
                loginCard.style.display = 'block';
                dashboardDiv.style.display = 'none';
                // Clear password fields
                newPasswordInput.value = '';
                confirmPasswordInput.value = '';
                showLoginMessage('Password changed. Please log in with your new password.', false);
            }, 2000);
        }

        // Back to login from reset card
        function backToLogin() {
            window.location.hash = '';
            supabaseClient.auth.signOut();
            resetCard.style.display = 'none';
            loginCard.style.display = 'block';
            dashboardDiv.style.display = 'none';
            newPasswordInput.value = '';
            confirmPasswordInput.value = '';
        }

        // Event listeners
        loginBtn.addEventListener('click', handleLogin);
        adminPasswordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
        logoutDashboardBtn.addEventListener('click', handleLogout);
        forgotBtn.addEventListener('click', () => { forgotModal.style.display = 'flex'; resetEmailInput.value = ''; modalMessageDiv.innerHTML = ''; });
        cancelModalBtn.addEventListener('click', () => { forgotModal.style.display = 'none'; });
        sendResetBtn.addEventListener('click', sendResetEmail);
        forgotModal.addEventListener('click', (e) => { if (e.target === forgotModal) forgotModal.style.display = 'none'; });
        resetPasswordBtn.addEventListener('click', updatePassword);
        backToLoginFromReset.addEventListener('click', backToLogin);

        // Check for existing session (normal login)
        async function checkExistingSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && !window.location.hash.includes('type=recovery')) {
                // Normal session, show dashboard
                loginCard.style.display = 'none';
                dashboardDiv.style.display = 'block';
                adminEmailDisplay.textContent = session.user.email;
            } else {
                loginCard.style.display = 'block';
                dashboardDiv.style.display = 'none';
            }
            // Check for recovery mode regardless
            await handleRecoveryMode();
        }

        // Listen to auth changes to handle recovery scenario
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if (event === 'SIGNED_IN' && session) {
                // If we are in recovery mode, do NOT show dashboard; we want reset form
                const isRecovery = window.location.hash.includes('type=recovery');
                if (!isRecovery) {
                    loginCard.style.display = 'none';
                    dashboardDiv.style.display = 'block';
                    adminEmailDisplay.textContent = session.user.email;
                    resetCard.style.display = 'none';
                } else {
                    // Already handled by handleRecoveryMode, but ensure reset card is visible
                    loginCard.style.display = 'none';
                    resetCard.style.display = 'block';
                    dashboardDiv.style.display = 'none';
                }
            } else if (event === 'SIGNED_OUT') {
                if (!window.location.hash.includes('type=recovery')) {
                    loginCard.style.display = 'block';
                    dashboardDiv.style.display = 'none';
                    resetCard.style.display = 'none';
                }
            }
        });

        checkExistingSession();
    </script>
</body>
</html>
