<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login – ArchStudio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* same as before, no changes */
        :root {
            --bg: #0f0f13; --card-bg: #1a1a23; --input-bg: #16161f; --border: #2a2a3a;
            --text: #e8e8f0; --text-muted: #a0a0b8; --accent: #c9a96e; --accent-glow: rgba(201,169,110,0.2);
            --danger: #e0556a;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Segoe UI',system-ui,sans-serif;
            background:radial-gradient(ellipse at 30% 20%,rgba(201,169,110,0.05) 0%,transparent 60%),radial-gradient(ellipse at 70% 70%,rgba(201,169,110,0.03) 0%,transparent 50%),var(--bg);
            display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px
        }
        .login-card{
            background:var(--card-bg);border:1px solid var(--border);border-radius:20px;
            padding:48px 40px;width:100%;max-width:420px;position:relative;overflow:hidden;
            box-shadow:0 8px 32px rgba(0,0,0,0.45)
        }
        .login-card::before{
            content:'';position:absolute;top:0;left:0;right:0;height:3px;
            background:linear-gradient(90deg,var(--accent),#d4bc8a,#b08d4a)
        }
        .logo{text-align:center;margin-bottom:32px}
        .logo .icon{font-size:40px;display:block;margin-bottom:12px}
        .logo h1{font-size:1.6rem;font-weight:700;color:var(--text);letter-spacing:-0.3px}
        .logo h1 span{color:var(--accent)}
        .logo p{color:var(--text-muted);font-size:0.9rem;margin-top:4px}
        .form-group{margin-bottom:20px}
        .form-group label{
            display:block;font-size:0.8rem;font-weight:600;text-transform:uppercase;
            letter-spacing:0.5px;color:var(--text-muted);margin-bottom:6px
        }
        .form-group input{
            width:100%;padding:13px 16px;background:var(--input-bg);border:1.5px solid var(--border);
            border-radius:8px;color:var(--text);font-size:1rem;font-family:inherit;
            transition:border-color 0.25s,box-shadow 0.25s;outline:none
        }
        .form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
        .error-message{
            background:rgba(224,85,106,0.15);color:var(--danger);padding:10px 14px;
            border-radius:8px;font-size:0.85rem;margin-bottom:16px;display:none;text-align:center
        }
        .error-message.show{display:block}
        .btn{
            width:100%;padding:14px;background:var(--accent);color:#1a1a15;border:none;
            border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;
            transition:background 0.25s,box-shadow 0.25s;font-family:inherit;
            display:flex;align-items:center;justify-content:center;gap:8px
        }
        .btn:hover{background:#d4bc8a;box-shadow:0 0 20px var(--accent-glow)}
        .btn:disabled{opacity:0.7;cursor:not-allowed}
        .spinner{
            display:inline-block;width:18px;height:18px;border:2px solid transparent;
            border-top-color:#1a1a15;border-radius:50%;animation:spin 0.6s linear infinite
        }
        @keyframes spin{to{transform:rotate(360deg)}}
        .note{text-align:center;margin-top:16px;font-size:0.78rem;color:var(--text-muted)}
        .note a{color:var(--accent);text-decoration:none}
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <span class="icon">🏛️</span>
            <h1>Arch<span>Studio</span></h1>
            <p>Admin / Moderator Portal</p>
        </div>
        <div class="error-message" id="errorBox"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@archstudio.com" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn" id="loginBtn">
                <span id="btnText">🔐 Sign In</span>
                <span class="spinner" id="spinner" style="display:none;"></span>
            </button>
        </form>
        <p class="note">Not registered? Contact the administrator.</p>
    </div>

    <script>
        const SUPABASE_URL = 'https://sdrwdvvrojhhxnyydsao.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkcndkdnZyb2poaHhueXlkc2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODQ3MTYsImV4cCI6MjA5NTQ2MDcxNn0.M67nknliCzw3EcfHM5EhbSxan1gedDmOVwsWOK4sYMM';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorBox = document.getElementById('errorBox');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.classList.add('show');
        }
        function hideError() {
            errorBox.textContent = '';
            errorBox.classList.remove('show');
        }
        function setLoading(loading) {
            loginBtn.disabled = loading;
            btnText.style.display = loading ? 'none' : 'inline';
            spinner.style.display = loading ? 'inline-block' : 'none';
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showError('Please enter both email and password.');
                return;
            }

            setLoading(true);
            try {
                // 1. Sign in
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;
                const user = data.user;
                if (!user) throw new Error('No user returned.');

                console.log('✅ Signed in as:', user.email, 'ID:', user.id);

                // 2. Fetch profile
                let profile = null;
                const { data: profileData, error: profileError } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', user.id)
                    .single();

                if (profileError) {
                    console.warn('⚠️ Profile fetch error:', profileError.message);
                    // If table doesn't exist or RLS blocks, assume no profile
                    window.location.href = './complete-profile.html';
                    return;
                }

                profile = profileData;
                console.log('📋 Profile found:', profile);

                // 3. Decision tree
                if (!profile) {
                    console.log('➡️ No profile row → complete-profile');
                    window.location.href = './complete-profile.html';
                    return;
                }

                // Check approval status
                if (profile.approval_status === 'pending') {
                    console.log('⌛ Status is pending → pending-approval');
                    window.location.href = './pending-approval.html';
                    return;
                }

                if (profile.approval_status === 'approved') {
                    console.log('✅ Status is approved, role:', profile.role);
                    if (profile.role === 'admin') {
                        console.log('➡️ Redirecting to admin-dashboard.html');
                        window.location.href = './admin-dashboard.html';
                    } else {
                        console.log('➡️ Redirecting to moderator-dashboard.html');
                        window.location.href = './moderator-dashboard.html';
                    }
                    return;
                }

                // Rejected or unknown
                console.log('❓ Approval status is:', profile.approval_status, '→ sending to pending');
                window.location.href = './pending-approval.html';

            } catch (error) {
                console.error('❌ Login error:', error);
                let message = 'Login failed. Please check your credentials.';
                if (error.message.includes('Invalid login credentials')) message = 'Invalid email or password.';
                else if (error.message.includes('Email not confirmed')) message = 'Please confirm your email first.';
                showError(message);
            } finally {
                setLoading(false);
            }
        });

        emailInput.addEventListener('input', hideError);
        passwordInput.addEventListener('input', hideError);
    </script>
</body>
</html>
