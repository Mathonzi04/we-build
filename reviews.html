<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews | A+Connect Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: system-ui, sans-serif; background: #f1f5f9; }
    .admin-header { background: white; padding: 1rem 2rem; display: flex; justify-content: space-between; }
    .nav-links { background: white; padding: 0.5rem 2rem; display: flex; gap: 1.5rem; border-bottom: 1px solid #e2e8f0; }
    .nav-links a { text-decoration: none; color: #475569; }
    .nav-links a.active { color: #e67e22; border-bottom: 2px solid #e67e22; }
    .content { padding: 2rem; max-width: 1400px; margin: 0 auto; }
    .card { background: white; border-radius: 24px; padding: 1.5rem; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #e2e8f0; }
    .btn-sm { padding: 0.3rem 0.8rem; border-radius: 30px; border: none; cursor: pointer; margin: 2px; }
    .btn-success { background: #10b981; color: white; }
    .btn-danger { background: #ef4444; color: white; }
  </style>
</head>
<body>
<div class="admin-header">
  <h1><i class="fas fa-star"></i> Reviews</h1>
  <button id="logoutBtn">Logout</button>
</div>
<div class="nav-links">
  <a href="dashboard.html">Dashboard</a>
  <a href="templates.html">Templates</a>
  <a href="messages.html">Messages</a>
  <a href="reviews.html" class="active">Reviews</a>
  <a href="about.html">About</a>
</div>
<div class="content">
  <div class="card">
    <h3>Customer Reviews</h3>
    <table id="reviewsTable">
      <thead><tr><th>Customer</th><th>Rating</th><th>Comment</th><th>Approved</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://sdrwdvvrojhhxnyydsao.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkcndkdnZyb2poaHhueXlkc2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODQ3MTYsImV4cCI6MjA5NTQ2MDcxNn0.M67nknliCzw3EcfHM5EhbSxan1gedDmOVwsWOK4sYMM';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function checkAuth() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) window.location.href = 'login.html';
  }

  async function loadReviews() {
    const { data } = await supabase.from('reviews').select('*').order('created_at', { ascending: false });
    const tbody = document.querySelector('#reviewsTable tbody');
    tbody.innerHTML = data.map(r => `
      <tr>
        <td>${escapeHtml(r.customer_name)}</td>
        <td>${r.rating}★</td>
        <td>${escapeHtml(r.comment)}</td>
        <td>${r.is_approved ? '✅ Yes' : '❌ No'}</td>
        <td>
          ${!r.is_approved ? `<button class="btn-sm btn-success" onclick="approveReview('${r.id}')">Approve</button>` : ''}
          <button class="btn-sm btn-danger" onclick="deleteReview('${r.id}')">Delete</button>
        </td>
      </tr>
    `).join('');
  }

  window.approveReview = async (id) => {
    await supabase.from('reviews').update({ is_approved: true }).eq('id', id);
    loadReviews();
  };

  window.deleteReview = async (id) => {
    if (confirm('Delete this review?')) {
      await supabase.from('reviews').delete().eq('id', id);
      loadReviews();
    }
  };

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  });

  function escapeHtml(str) {
    return str?.replace(/[&<>]/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];
    }) || '';
  }

  checkAuth();
  loadReviews();
</script>
</body>
</html>
