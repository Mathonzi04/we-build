<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Profile – ArchStudio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #0f0f13;
            --card-bg: #1a1a23;
            --input-bg: #16161f;
            --border: #2a2a3a;
            --text: #e8e8f0;
            --text-muted: #a0a0b8;
            --accent: #c9a96e;
            --accent-glow: rgba(201,169,110,0.2);
            --danger: #e0556a;
            --radius: 12px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(ellipse at 30% 20%, rgba(201,169,110,0.05) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 70%, rgba(201,169,110,0.03) 0%, transparent 50%),
                        var(--bg);
            display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
        }
        .profile-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px;
            padding: 40px; width: 100%; max-width: 500px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.45);
            position: relative; overflow: hidden;
        }
        .profile-card::before {
            content: ''; position: absolute; top:0; left:0; right:0; height:3px;
            background: linear-gradient(90deg, var(--accent), #d4bc8a, #b08d4a);
        }
        .logo { text-align: center; margin-bottom: 28px; }
        .logo .icon { font-size: 36px; display: block; margin-bottom: 10px; }
        .logo h2 { font-size: 1.4rem; color: var(--text); font-weight: 700; }
        .logo p { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }
        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block; font-size: 0.78rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 5px;
        }
        .form-group input {
            width: 100%; padding: 12px 14px; background: var(--input-bg);
            border: 1.5px solid var(--border); border-radius: 8px;
            color: var(--text); font-size: 0.95rem; font-family: inherit;
            transition: border-color 0.25s, box-shadow 0.25s; outline: none;
        }
        .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .form-group input:disabled {
            opacity: 0.6; cursor: not-allowed; background: var(--bg);
        }
        .btn {
            width: 100%; padding: 14px; background: var(--accent); color: #1a1a15;
            border: none; border-radius: 8px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: background 0.25s, box-shadow 0.25s;
            font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:hover { background: #d4bc8a; box-shadow: 0 0 20px var(--accent-glow); }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .spinner {
            display: inline-block; width: 18px; height: 18px; border: 2px solid transparent;
            border-top-color: #1a1a15; border-radius: 50%; animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-box {
            background: rgba(224,85,106,0.15); color: var(--danger); padding: 10px 14px;
            border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; display: none; text-align: center;
        }
        .error-box.show { display: block; }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="logo">
            <span class="icon">👤</span>
            <h2>Complete Your Profile</h2>
            <p>Moderator Account Setup</p>
        </div>
        <div class="error-box" id="errorBox"></div>
        <form id="profileForm">
            <div class="form-group">
                <label>Email (non‑editable)</label>
                <input type="email" id="email" disabled>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="+1234567890" required>
            </div>
            <div class="form-group">
                <label>Age</label>
                <input type="number" id="age" placeholder="25" min="18" max="100" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">📝 Submit Profile</span>
                <span class="spinner" id="spinner" style="display:none;"></span>
            </button>
        </form>
    </div>

    <script>
        // Use a unique name to avoid conflict with other scripts
        const SUPABASE_URL = 'https://sdrwdvvrojhhxnyydsao.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkcndkdnZyb2poaHhueXlkc2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODQ3MTYsImV4cCI6MjA5NTQ2MDcxNn0.M67nknliCzw3EcfHM5EhbSxan1gedDmOVwsWOK4sYMM';
        const supabaseProfile = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('profileForm');
        const emailInput = document.getElementById('email');
        const errorBox = document.getElementById('errorBox');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');

        async function checkSession() {
            const { data: { session } } = await supabaseProfile.auth.getSession();
            if (!session) {
                window.location.href = './login.html';
                return null;
            }
            return session;
        }

        async function init() {
            const session = await checkSession();
            if (!session) return;
            emailInput.value = session.user.email;

            const { data: existingProfile } = await supabaseProfile
                .from('profiles')
                .select('*')
                .eq('id', session.user.id)
                .single();

            if (existingProfile && existingProfile.approval_status !== 'pending') {
                window.location.href = './pending-approval.html';
            }
        }

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.classList.add('show');
        }
        function hideError() {
            errorBox.textContent = '';
            errorBox.classList.remove('show');
        }
        function setLoading(loading) {
            submitBtn.disabled = loading;
            btnText.style.display = loading ? 'none' : 'inline';
            spinner.style.display = loading ? 'inline-block' : 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            const session = await checkSession();
            if (!session) return;

            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const age = parseInt(document.getElementById('age').value);

            if (!fullName || !phone || isNaN(age)) {
                showError('Please fill all required fields.');
                return;
            }

            setLoading(true);
            try {
                const profileData = {
                    id: session.user.id,
                    full_name: fullName,
                    phone: phone,
                    age: age,
                    email: session.user.email,
                    role: 'moderator',
                    approval_status: 'pending',
                    updated_at: new Date().toISOString(),
                };

                const { error: upsertError } = await supabaseProfile
                    .from('profiles')
                    .upsert(profileData, { onConflict: 'id' });

                if (upsertError) throw upsertError;

                window.location.href = './pending-approval.html';
            } catch (err) {
                console.error(err);
                showError(err.message || 'Something went wrong.');
            } finally {
                setLoading(false);
            }
        });

        init();
    </script>
</body>
</html>
