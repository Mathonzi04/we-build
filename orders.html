<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f0f4f8; padding: 1.5rem; }
        .container { max-width: 1300px; margin: 0 auto; }
        .header { background: white; border-radius: 1rem; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .logout-btn { background: #e53e3e; color: white; border: none; padding: 0.5rem 1.2rem; border-radius: 2rem; cursor: pointer; }
        .card { background: white; border-radius: 1rem; padding: 1.2rem; margin-bottom: 1rem; }
        .order-item { border-bottom: 1px solid #e2e8f0; padding: 1rem 0; }
        .badge { background: #e2e8f0; padding: 0.2rem 0.6rem; border-radius: 2rem; font-size: 0.75rem; }
        .badge-building { background: #feebc8; color: #c05621; }
        .btn { background: #1e2a47; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 0.5rem; cursor: pointer; margin-right: 0.5rem; }
        .btn-success { background: #2f855a; }
        .email-client { background: #3182ce; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2><i class="fas fa-shopping-cart"></i> Orders (Bookings)</h2>
        <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
    <div id="ordersContainer">Loading...</div>
</div>

<script>
(function() {
    const SUPABASE_URL = 'https://sdrwdvvrojhhxnyydsao.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkcndkdnZyb2poaHhueXlkc2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODQ3MTYsImV4cCI6MjA5NTQ2MDcxNn0.M67nknliCzw3EcfHM5EhbSxan1gedDmOVwsWOK4sYMM';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const LOGIN_URL = 'https://mathonzi04.github.io/we-build/login.html';

    async function checkAuth() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) window.location.href = LOGIN_URL;
    }

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    async function loadOrders() {
        const container = document.getElementById('ordersContainer');
        const { data, error } = await _supabase.from('bookings').select('*, templates(name)').order('booked_at', { ascending: false });
        if (error) { container.innerHTML = '<div class="card error-msg">Error loading orders</div>'; return; }
        if (!data || data.length === 0) { container.innerHTML = '<div class="card">No bookings yet.</div>'; return; }
        container.innerHTML = data.map(b => `
            <div class="card order-item">
                <div><strong>${escapeHtml(b.customer_name)}</strong> (${escapeHtml(b.customer_email)})</div>
                <div>Template: ${b.templates ? escapeHtml(b.templates.name) : 'Deleted'}</div>
                <div>Reference: <code>${b.reference_number}</code></div>
                <div>Status: <span class="badge ${b.website_status === 'building' ? 'badge-building' : ''}">${b.website_status || 'pending'}</span></div>
                <div style="margin-top:0.5rem;">
                    <button class="email-client btn email-client" data-email="${b.customer_email}" data-name="${b.customer_name}"><i class="fas fa-envelope"></i> Email Client</button>
                    ${b.website_status !== 'building' ? `<button class="start-building btn btn-success" data-id="${b.id}">Start Building Website</button>` : ''}
                    ${b.website_status === 'building' ? `<button class="mark-active btn" data-id="${b.id}">Mark as Active (Website Delivered)</button>` : ''}
                </div>
            </div>
        `).join('');
        document.querySelectorAll('.email-client').forEach(btn => {
            btn.addEventListener('click', () => {
                const email = btn.dataset.email;
                const name = btn.dataset.name;
                window.location.href = `mailto:${email}?subject=Your website is being built&body=Hi ${name}, we are starting your website.`;
            });
        });
        document.querySelectorAll('.start-building').forEach(btn => {
            btn.addEventListener('click', async () => {
                await _supabase.from('bookings').update({ website_status: 'building' }).eq('id', btn.dataset.id);
                loadOrders();
            });
        });
        document.querySelectorAll('.mark-active').forEach(btn => {
            btn.addEventListener('click', async () => {
                const url = prompt('Enter the client\'s website URL:');
                if (url) {
                    await _supabase.from('bookings').update({ website_status: 'active', website_url: url }).eq('id', btn.dataset.id);
                    loadOrders();
                }
            });
        });
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => { await _supabase.auth.signOut(); window.location.href = LOGIN_URL; });
    checkAuth();
    loadOrders();
})();
</script>
</body>
</html>
