<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | A+Connect Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: system-ui, sans-serif; background: #f1f5f9; }
    .admin-header {
      background: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
    }
    .admin-header h1 { font-size: 1.4rem; }
    .nav-links {
      background: white;
      padding: 0.5rem 2rem;
      display: flex;
      gap: 1.5rem;
      border-bottom: 1px solid #e2e8f0;
    }
    .nav-links a {
      text-decoration: none;
      color: #475569;
      padding: 0.5rem 0;
    }
    .nav-links a.active {
      color: #e67e22;
      border-bottom: 2px solid #e67e22;
    }
    .content { padding: 2rem; max-width: 1400px; margin: 0 auto; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: white;
      padding: 1.2rem;
      border-radius: 24px;
      text-align: center;
    }
    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 30px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="admin-header">
  <h1><i class="fas fa-crown"></i> A+Connect Admin</h1>
  <button id="logoutBtn" class="logout-btn">Logout</button>
</div>
<div class="nav-links">
  <a href="dashboard.html" class="active">Dashboard</a>
  <a href="templates.html">Templates</a>
  <a href="messages.html">Messages</a>
  <a href="reviews.html">Reviews</a>
  <a href="about.html">About</a>
</div>
<div class="content">
  <div class="stats-grid" id="stats"></div>
  <div style="background:white; border-radius:24px; padding:1.5rem;">
    <h3>Quick links</h3>
    <p><a href="templates.html">➕ Add new template</a> | <a href="reviews.html">⭐ Approve reviews</a></p>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://sdrwdvvrojhhxnyydsao.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkcndkdnZyb2poaHhueXlkc2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODQ3MTYsImV4cCI6MjA5NTQ2MDcxNn0.M67nknliCzw3EcfHM5EhbSxan1gedDmOVwsWOK4sYMM';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function checkAuth() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) window.location.href = 'login.html';
  }

  async function loadStats() {
    const { count: templates } = await supabase.from('projects').select('*', { count: 'exact', head: true });
    const { count: messages } = await supabase.from('contact_messages').select('*', { count: 'exact', head: true });
    const { count: reviews } = await supabase.from('reviews').select('*', { count: 'exact', head: true });
    const { count: pending } = await supabase.from('reviews').select('*', { count: 'exact', head: true }).eq('is_approved', false);
    document.getElementById('stats').innerHTML = `
      <div class="stat-card"><i class="fas fa-code"></i><h3>${templates || 0}</h3><p>Templates</p></div>
      <div class="stat-card"><i class="fas fa-envelope"></i><h3>${messages || 0}</h3><p>Messages</p></div>
      <div class="stat-card"><i class="fas fa-star"></i><h3>${reviews || 0}</h3><p>Reviews</p></div>
      <div class="stat-card"><i class="fas fa-clock"></i><h3>${pending || 0}</h3><p>Pending reviews</p></div>
    `;
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  });

  checkAuth();
  loadStats();
</script>
</body>
</html>
