<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | CodeCrafted</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #f0f4f8; min-height: 100vh; }
        .app { display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: linear-gradient(180deg, #1e2a47 0%, #0f1a2e 100%); color: white; padding: 2rem 1.5rem; position: fixed; height: 100vh; overflow-y: auto; }
        .sidebar h2 { font-size: 1.5rem; margin-bottom: 2rem; display: flex; align-items: center; gap: 0.5rem; }
        .sidebar nav { display: flex; flex-direction: column; gap: 0.5rem; }
        .sidebar nav a { color: #cbd5e0; text-decoration: none; padding: 0.75rem 1rem; border-radius: 0.75rem; display: flex; align-items: center; gap: 0.75rem; transition: 0.2s; }
        .sidebar nav a:hover, .sidebar nav a.active { background: #2c5282; color: white; }
        .main { margin-left: 280px; flex: 1; padding: 1.5rem 2rem; }
        .top-bar { background: white; border-radius: 1rem; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .welcome-area { display: flex; align-items: center; gap: 1rem; }
        .edit-name-btn { background: #e2e8f0; border: none; padding: 0.3rem 0.8rem; border-radius: 2rem; cursor: pointer; }
        .logout-btn { background: #e53e3e; color: white; border: none; padding: 0.5rem 1.2rem; border-radius: 2rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .stat-card { background: white; border-radius: 1rem; padding: 1.2rem; border-left: 4px solid #1e2a47; }
        .stat-number { font-size: 2.2rem; font-weight: 700; color: #1e2a47; }
        .quick-links { background: white; border-radius: 1rem; padding: 1.2rem; }
        .links-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.8rem; margin-top: 1rem; }
        .quick-link { background: #f7fafc; padding: 0.8rem; border-radius: 0.8rem; text-align: center; text-decoration: none; color: #1e2a47; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-card { background: white; max-width: 400px; width: 90%; border-radius: 1rem; padding: 1.5rem; text-align: center; }
        .modal-card input { width: 100%; padding: 0.7rem; margin: 1rem 0; border: 1px solid #cbd5e0; border-radius: 0.5rem; }
        .btn-primary { background: #1e2a47; color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; }
        footer { text-align: center; margin-top: 2rem; font-size: 0.75rem; color: #718096; }
        @media (max-width: 768px) { .sidebar { width: 80px; padding: 1rem; } .sidebar span:not(.icon-only) { display: none; } .main { margin-left: 80px; } }
    </style>
</head>
<body>
<div class="app">
    <div class="sidebar">
        <h2><i class="fas fa-code"></i> <span>CodeCrafted</span></h2>
        <nav>
            <a href="#" class="active"><i class="fas fa-tachometer-alt"></i> <span>Dashboard</span></a>
            <a href="about-us.html"><i class="fas fa-users"></i> <span>About Us</span></a>
            <a href="messages.html"><i class="fas fa-envelope"></i> <span>Messages</span></a>
            <a href="projects.html"><i class="fas fa-folder-open"></i> <span>Projects</span></a>
            <a href="orders.html"><i class="fas fa-shopping-cart"></i> <span>Orders</span></a>
            <a href="active-services.html"><i class="fas fa-chalkboard"></i> <span>Active Services</span></a>
        </nav>
    </div>
    <div class="main">
        <div class="top-bar">
            <div class="welcome-area"><h3><i class="fas fa-hand-wave"></i> Welcome, <span id="adminNameDisplay">Admin</span></h3><button id="editNameBtn" class="edit-name-btn"><i class="fas fa-pen"></i> Edit</button></div>
            <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><h3><i class="fas fa-chalkboard"></i> Active Services</h3><div class="stat-number" id="activeServicesCount">-</div></div>
            <div class="stat-card"><h3><i class="fas fa-folder-open"></i> Total Projects</h3><div class="stat-number" id="projectsCount">-</div></div>
            <div class="stat-card"><h3><i class="fas fa-envelope"></i> Pending Messages</h3><div class="stat-number" id="pendingMessagesCount">-</div></div>
            <div class="stat-card"><h3><i class="fas fa-shopping-cart"></i> Pending Orders</h3><div class="stat-number" id="pendingOrdersCount">-</div></div>
        </div>
        <div class="quick-links"><h3><i class="fas fa-link"></i> Quick Actions</h3><div class="links-grid"><a href="orders.html" class="quick-link"><i class="fas fa-plus-circle"></i> New Order</a><a href="projects.html" class="quick-link"><i class="fas fa-upload"></i> Add Project</a><a href="messages.html" class="quick-link"><i class="fas fa-reply-all"></i> Reply Messages</a><a href="active-services.html" class="quick-link"><i class="fas fa-bell"></i> Send Alerts</a></div></div>
        <footer><i class="fas fa-copyright"></i> 2025 CodeCrafted – Admin Panel</footer>
    </div>
</div>
<div id="nameModal" class="modal"><div class="modal-card"><h3><i class="fas fa-user-edit"></i> Set Your Name</h3><input type="text" id="adminNameInput" placeholder="Your name"><button id="saveNameBtn" class="btn-primary">Save</button><button id="closeNameModal" class="btn-primary" style="background:#718096; margin-top:0.5rem;">Cancel</button></div></div>
<script>
(async function() {
    const SUPABASE_URL = 'https://sdrwdvvrojhhxnyydsao.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkcndkdnZyb2poaHhueXlkc2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODQ3MTYsImV4cCI6MjA5NTQ2MDcxNn0.M67nknliCzw3EcfHM5EhbSxan1gedDmOVwsWOK4sYMM';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const LOGIN_URL = 'https://mathonzi04.github.io/we-build/login.html';

    async function checkAuth() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) { window.location.href = LOGIN_URL; return false; }
        return true;
    }
    if (!(await checkAuth())) return;

    // Admin name
    function loadAdminName() { const saved = localStorage.getItem('admin_name'); if (saved) document.getElementById('adminNameDisplay').innerText = saved; else document.getElementById('nameModal').style.display = 'flex'; }
    function saveAdminName(name) { if (name && name.trim()) { localStorage.setItem('admin_name', name.trim()); document.getElementById('adminNameDisplay').innerText = name.trim(); } }
    document.getElementById('editNameBtn').addEventListener('click', () => { document.getElementById('adminNameInput').value = localStorage.getItem('admin_name') || ''; document.getElementById('nameModal').style.display = 'flex'; });
    document.getElementById('saveNameBtn').addEventListener('click', () => { saveAdminName(document.getElementById('adminNameInput').value); document.getElementById('nameModal').style.display = 'none'; });
    document.getElementById('closeNameModal').addEventListener('click', () => { document.getElementById('nameModal').style.display = 'none'; });
    loadAdminName();

    async function loadStats() {
        try {
            // Active Services
            const { count: activeCount, error: e1 } = await _supabase.from('bookings').select('*', { count: 'exact', head: true }).eq('website_status', 'active');
            if (!e1) document.getElementById('activeServicesCount').innerText = activeCount || 0; else console.error(e1);
            // Total Projects
            const { count: projCount, error: e2 } = await _supabase.from('projects').select('*', { count: 'exact', head: true });
            if (!e2) document.getElementById('projectsCount').innerText = projCount || 0; else console.error(e2);
            // Pending Messages
            let pending = 0;
            const { count: contact, error: e3 } = await _supabase.from('contact_messages').select('*', { count: 'exact', head: true }).neq('status', 'closed');
            if (!e3) pending += contact || 0;
            const { count: reviews, error: e4 } = await _supabase.from('reviews').select('*', { count: 'exact', head: true }).eq('is_approved', false);
            if (!e4) pending += reviews || 0;
            const { count: service, error: e5 } = await _supabase.from('service_messages').select('*', { count: 'exact', head: true }).eq('status', 'pending');
            if (!e5) pending += service || 0;
            document.getElementById('pendingMessagesCount').innerText = pending;
            // Pending Orders
            const { count: orders, error: e6 } = await _supabase.from('bookings').select('*', { count: 'exact', head: true }).in('website_status', ['pending', 'building']);
            if (!e6) document.getElementById('pendingOrdersCount').innerText = orders || 0;
        } catch(err) { console.error('Stats error:', err); }
    }
    loadStats();
    setInterval(loadStats, 30000);
    document.getElementById('logoutBtn').addEventListener('click', async () => { await _supabase.auth.signOut(); window.location.href = LOGIN_URL; });
})();
</script>
</body>
</html>
