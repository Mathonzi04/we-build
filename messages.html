<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages | A+Connect Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: system-ui, sans-serif; background: #f1f5f9; }
    .admin-header { background: white; padding: 1rem 2rem; display: flex; justify-content: space-between; }
    .nav-links { background: white; padding: 0.5rem 2rem; display: flex; gap: 1.5rem; border-bottom: 1px solid #e2e8f0; }
    .nav-links a { text-decoration: none; color: #475569; }
    .nav-links a.active { color: #e67e22; border-bottom: 2px solid #e67e22; }
    .content { padding: 2rem; max-width: 1400px; margin: 0 auto; }
    .card { background: white; border-radius: 24px; padding: 1.5rem; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #e2e8f0; }
  </style>
</head>
<body>
<div class="admin-header">
  <h1><i class="fas fa-envelope"></i> Messages</h1>
  <button id="logoutBtn">Logout</button>
</div>
<div class="nav-links">
  <a href="dashboard.html">Dashboard</a>
  <a href="templates.html">Templates</a>
  <a href="messages.html" class="active">Messages</a>
  <a href="reviews.html">Reviews</a>
  <a href="about.html">About</a>
</div>
<div class="content">
  <div class="card">
    <h3>Contact Messages</h3>
    <table id="messagesTable">
      <thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Subject</th><th>Message</th><th>Status</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://sdrwdvvrojhhxnyydsao.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkcndkdnZyb2poaHhueXlkc2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODQ3MTYsImV4cCI6MjA5NTQ2MDcxNn0.M67nknliCzw3EcfHM5EhbSxan1gedDmOVwsWOK4sYMM';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function checkAuth() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) window.location.href = 'login.html';
  }

  async function loadMessages() {
    const { data } = await supabase.from('contact_messages').select('*').order('created_at', { ascending: false });
    const tbody = document.querySelector('#messagesTable tbody');
    tbody.innerHTML = data.map(m => `
      <tr>
        <td>${new Date(m.created_at).toLocaleDateString()}</td>
        <td>${escapeHtml(m.customer_name)}</td>
        <td>${escapeHtml(m.customer_email)}</td>
        <td>${escapeHtml(m.subject)}</td>
        <td>${escapeHtml(m.message)}</td>
        <td>${m.status || 'new'}</td>
      </tr>
    `).join('');
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  });

  function escapeHtml(str) {
    return str?.replace(/[&<>]/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];
    }) || '';
  }

  checkAuth();
  loadMessages();
</script>
</body>
</html>
