<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us | Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
        body { background: #f0f4f8; padding: 1.5rem; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: white; border-radius: 1rem; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .logout-btn { background: #e53e3e; color: white; border: none; padding: 0.5rem 1.2rem; border-radius: 2rem; cursor: pointer; }
        .card { background: white; border-radius: 1rem; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .btn { background: #1e2a47; color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; margin: 0.2rem; }
        .btn-danger { background: #e53e3e; }
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 1rem; }
        .team-card { background: #f7fafc; border-radius: 1rem; padding: 1rem; text-align: center; }
        .team-card img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 0.5rem; }
        .story-content { background: #f7fafc; padding: 1rem; border-radius: 0.5rem; white-space: pre-wrap; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 0.3rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.6rem; border: 1px solid #cbd5e0; border-radius: 0.5rem; }
        .error-msg { color: #e53e3e; padding: 0.5rem; background: #fed7d7; border-radius: 0.5rem; margin: 0.5rem 0; }
        .success-msg { color: #2f855a; background: #c6f6d5; padding: 0.5rem; border-radius: 0.5rem; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-card { background: white; max-width: 500px; width: 90%; border-radius: 1rem; padding: 1.5rem; max-height: 80vh; overflow-y: auto; }
        .image-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-top: 0.5rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2><i class="fas fa-users"></i> About Us Management</h2>
        <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <!-- Our Story -->
    <div class="card">
        <h3><i class="fas fa-book-open"></i> Our Story</h3>
        <div id="storyDisplay" class="story-content">Loading...</div>
        <button id="editStoryBtn" class="btn" style="margin-top: 1rem;"><i class="fas fa-edit"></i> Edit Story</button>
        <div id="storyMessage"></div>
    </div>

    <!-- Team Members -->
    <div class="card">
        <h3><i class="fas fa-user-friends"></i> Team Members</h3>
        <button id="addMemberBtn" class="btn"><i class="fas fa-plus"></i> Add Team Member</button>
        <div id="teamContainer" class="team-grid">Loading...</div>
    </div>
</div>

<!-- Modal for Team Member -->
<div id="memberModal" class="modal">
    <div class="modal-card">
        <h3 id="modalTitle">Add Team Member</h3>
        <div class="form-group"><label>Name</label><input type="text" id="memberName"></div>
        <div class="form-group"><label>Role</label><input type="text" id="memberRole"></div>
        <div class="form-group"><label>Bio</label><textarea id="memberBio" rows="3"></textarea></div>
        <div class="form-group"><label>Profile Picture (optional)</label><input type="file" id="memberImage" accept="image/*"></div>
        <div id="imagePreview"></div>
        <input type="hidden" id="editMemberId">
        <button id="saveMemberBtn" class="btn">Save</button>
        <button id="closeModalBtn" class="btn btn-danger">Cancel</button>
        <div id="modalMessage"></div>
    </div>
</div>

<script>
(async function() {
    const SUPABASE_URL = 'https://sdrwdvvrojhhxnyydsao.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkcndkdnZyb2poaHhueXlkc2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODQ3MTYsImV4cCI6MjA5NTQ2MDcxNn0.M67nknliCzw3EcfHM5EhbSxan1gedDmOVwsWOK4sYMM';
    const LOGIN_URL = 'https://mathonzi04.github.io/we-build/login.html';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Helper
    function showError(container, msg) { container.innerHTML = `<div class="error-msg"><i class="fas fa-exclamation-triangle"></i> ${msg}</div>`; }
    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    // Auth check
    const { data: { session } } = await _supabase.auth.getSession();
    if (!session) { window.location.href = LOGIN_URL; return; }

    // ---------- Our Story (site_settings) ----------
    async function loadStory() {
        const container = document.getElementById('storyDisplay');
        const storyMsg = document.getElementById('storyMessage');
        try {
            const { data, error } = await _supabase.from('site_settings').select('value').eq('key', 'our_story').maybeSingle();
            if (error) throw error;
            if (data) container.innerText = data.value;
            else container.innerText = 'CodeCrafted – We build stunning websites in 2 days.';
        } catch (err) {
            console.error('Story error:', err);
            container.innerText = 'Failed to load story. Using default.';
            storyMsg.innerHTML = `<div class="error-msg">Error: ${err.message}</div>`;
        }
    }

    async function saveStory(newStory) {
        const storyMsg = document.getElementById('storyMessage');
        try {
            const { error } = await _supabase.from('site_settings').upsert({ key: 'our_story', value: newStory }, { onConflict: 'key' });
            if (error) throw error;
            storyMsg.innerHTML = '<div class="success-msg">Story updated!</div>';
            setTimeout(() => storyMsg.innerHTML = '', 2000);
            loadStory();
        } catch (err) {
            storyMsg.innerHTML = `<div class="error-msg">Error: ${err.message}</div>`;
        }
    }

    document.getElementById('editStoryBtn').addEventListener('click', () => {
        const current = document.getElementById('storyDisplay').innerText;
        const newStory = prompt('Edit Our Story:', current);
        if (newStory && newStory !== current) saveStory(newStory);
    });

    // ---------- Team Members ----------
    async function loadTeamMembers() {
        const container = document.getElementById('teamContainer');
        try {
            const { data, error } = await _supabase.from('team_members').select('*').order('display_order', { ascending: true });
            if (error) throw error;
            if (!data || data.length === 0) {
                container.innerHTML = '<p>No team members yet. Click "Add Team Member".</p>';
                return;
            }
            container.innerHTML = data.map(m => `
                <div class="team-card">
                    ${m.profile_image ? `<img src="${m.profile_image}" alt="${escapeHtml(m.name)}">` : '<i class="fas fa-user-circle" style="font-size: 4rem;"></i>'}
                    <h3>${escapeHtml(m.name)}</h3>
                    <p><strong>${escapeHtml(m.role)}</strong></p>
                    <p>${escapeHtml(m.bio || '')}</p>
                    <button class="edit-member btn" data-id="${m.id}" data-name="${escapeHtml(m.name)}" data-role="${escapeHtml(m.role)}" data-bio="${escapeHtml(m.bio || '')}" data-image="${m.profile_image || ''}">Edit</button>
                    <button class="delete-member btn btn-danger" data-id="${m.id}">Delete</button>
                </div>
            `).join('');
            // Attach events
            document.querySelectorAll('.edit-member').forEach(btn => {
                btn.addEventListener('click', () => {
                    openModal({
                        id: btn.dataset.id,
                        name: btn.dataset.name,
                        role: btn.dataset.role,
                        bio: btn.dataset.bio,
                        image: btn.dataset.image
                    });
                });
            });
            document.querySelectorAll('.delete-member').forEach(btn => {
                btn.addEventListener('click', async () => {
                    if (confirm('Delete this team member?')) {
                        await _supabase.from('team_members').delete().eq('id', btn.dataset.id);
                        loadTeamMembers();
                    }
                });
            });
        } catch (err) {
            console.error('Team members error:', err);
            showError(container, err.message);
        }
    }

    const modal = document.getElementById('memberModal');
    const modalTitle = document.getElementById('modalTitle');
    const memberName = document.getElementById('memberName');
    const memberRole = document.getElementById('memberRole');
    const memberBio = document.getElementById('memberBio');
    const memberImage = document.getElementById('memberImage');
    const imagePreview = document.getElementById('imagePreview');
    const editMemberId = document.getElementById('editMemberId');
    const modalMessage = document.getElementById('modalMessage');

    function openModal(data = null) {
        modalTitle.innerText = data && data.id ? 'Edit Team Member' : 'Add Team Member';
        memberName.value = data?.name || '';
        memberRole.value = data?.role || '';
        memberBio.value = data?.bio || '';
        editMemberId.value = data?.id || '';
        imagePreview.innerHTML = '';
        if (data?.image && data.image !== 'null') {
            const img = document.createElement('img');
            img.src = data.image;
            img.className = 'image-preview';
            imagePreview.appendChild(img);
        }
        modalMessage.innerHTML = '';
        modal.style.display = 'flex';
    }

    async function saveMember() {
        const name = memberName.value.trim();
        const role = memberRole.value.trim();
        if (!name || !role) {
            modalMessage.innerHTML = '<div class="error-msg">Name and role required</div>';
            return;
        }
        const bio = memberBio.value.trim();
        let profile_image = null;
        if (memberImage.files && memberImage.files[0]) {
            const file = memberImage.files[0];
            const reader = new FileReader();
            profile_image = await new Promise(resolve => {
                reader.onload = () => resolve(reader.result);
                reader.readAsDataURL(file);
            });
        } else if (editMemberId.value) {
            // keep existing image
            const existing = await _supabase.from('team_members').select('profile_image').eq('id', editMemberId.value).single();
            if (!existing.error) profile_image = existing.data?.profile_image;
        }
        const memberData = { name, role, bio, profile_image, display_order: 0 };
        try {
            if (editMemberId.value) {
                await _supabase.from('team_members').update(memberData).eq('id', editMemberId.value);
            } else {
                await _supabase.from('team_members').insert(memberData);
            }
            modal.style.display = 'none';
            memberImage.value = '';
            loadTeamMembers();
        } catch (err) {
            modalMessage.innerHTML = `<div class="error-msg">${err.message}</div>`;
        }
    }

    document.getElementById('addMemberBtn').addEventListener('click', () => openModal());
    document.getElementById('saveMemberBtn').addEventListener('click', saveMember);
    document.getElementById('closeModalBtn').addEventListener('click', () => modal.style.display = 'none');
    window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await _supabase.auth.signOut();
        window.location.href = LOGIN_URL;
    });

    // Initial load
    await loadStory();
    await loadTeamMembers();
})();
</script>
</body>
</html>
