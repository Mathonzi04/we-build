<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pending Approval – ArchStudio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #0f0f13;
            --card-bg: #1a1a23;
            --text: #e8e8f0;
            --text-muted: #a0a0b8;
            --accent: #c9a96e;
            --accent-glow: rgba(201,169,110,0.2);
            --border: #2a2a3a;
            --radius: 20px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(ellipse at 30% 20%, rgba(201,169,110,0.05) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 70%, rgba(201,169,110,0.03) 0%, transparent 50%),
                        var(--bg);
            display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
        }
        .pending-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 48px 40px; width: 100%; max-width: 460px;
            text-align: center; position: relative; overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.45);
        }
        .pending-card::before {
            content: ''; position: absolute; top:0; left:0; right:0; height:3px;
            background: linear-gradient(90deg, var(--accent), #d4bc8a, #b08d4a);
        }
        .icon { font-size: 60px; display: block; margin-bottom: 24px; }
        h2 { font-size: 1.5rem; color: var(--text); font-weight: 700; margin-bottom: 8px; }
        .user-greeting { color: var(--accent); font-weight: 600; font-size: 0.9rem; margin-bottom: 16px; }
        p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 28px; }
        .status-badge {
            display: inline-block; background: rgba(201,169,110,0.15); color: var(--accent);
            padding: 8px 20px; border-radius: 30px; font-size: 0.85rem; font-weight: 600;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 24px; background: var(--accent); color: #1a1a15;
            border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: background 0.25s, box-shadow 0.25s;
            font-family: inherit; margin: 6px;
        }
        .btn:hover { background: #d4bc8a; box-shadow: 0 0 20px var(--accent-glow); }
        .btn-outline {
            background: transparent; border: 1.5px solid var(--border); color: var(--text);
        }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
        .note { margin-top: 20px; font-size: 0.78rem; color: var(--text-muted); }
        .spinner {
            display: inline-block; width: 18px; height: 18px; border: 2px solid transparent;
            border-top-color: #1a1a15; border-radius: 50%; animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="pending-card">
        <span class="icon">⏳</span>
        <h2>Account Pending Approval</h2>
        <div class="user-greeting" id="userGreeting">Loading your details...</div>
        <p>
            Your moderator account is waiting for admin approval.<br>
            You'll be redirected automatically once approved.
        </p>
        <div class="status-badge" id="statusBadge">🟡 Pending</div>
        <div id="redirectMsg" style="color:var(--text-muted); font-size:0.85rem; margin-top:10px;"></div>
        <button class="btn" id="checkBtn">
            <span id="btnText">🔄 Check Status</span>
            <span class="spinner" id="spinner" style="display:none;"></span>
        </button>
        <button class="btn btn-outline" onclick="logout()">🚪 Logout</button>
        <p class="note">Auto‑checking every 5 seconds</p>
    </div>

<script>
    const SUPABASE_URL = 'https://sdrwdvvrojhhxnyydsao.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkcndkdnZyb2poaHhueXlkc2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODQ3MTYsImV4cCI6MjA5NTQ2MDcxNn0.M67nknliCzw3EcfHM5EhbSxan1gedDmOVwsWOK4sYMM';
    const supabasePending = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const userGreeting = document.getElementById('userGreeting');
    const statusBadge = document.getElementById('statusBadge');
    const redirectMsg = document.getElementById('redirectMsg');
    const checkBtn = document.getElementById('checkBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    let pollingInterval = null;

    // ----- DEBUG: add a debug info paragraph below the note (optional) -----
    const debugEl = document.createElement('p');
    debugEl.style.fontSize = '0.75rem';
    debugEl.style.color = '#888';
    debugEl.style.marginTop = '16px';
    debugEl.textContent = 'Debug info will appear here...';
    document.querySelector('.pending-card').appendChild(debugEl);

    function logDebug(msg) {
        console.log(msg);
        debugEl.textContent = msg;
    }

    async function fetchUserDetails(session) {
        const { data: profile } = await supabasePending
            .from('profiles')
            .select('full_name, email, id')
            .eq('id', session.user.id)
            .single();

        if (profile && profile.full_name) {
            userGreeting.textContent = `Welcome, ${profile.full_name} (${profile.email || session.user.email})`;
        } else {
            userGreeting.textContent = `Welcome, ${session.user.email}`;
        }
        logDebug(`User ID: ${session.user.id} | Profile found: ${profile ? 'yes' : 'no'} | Full name: ${profile?.full_name || 'none'}`);
    }

    async function checkApprovalStatus(isManual = false) {
        if (isManual) {
            checkBtn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'inline-block';
            redirectMsg.textContent = '';
        }

        try {
            const { data: { session } } = await supabasePending.auth.getSession();
            if (!session) {
                window.location.href = './login.html';
                return;
            }

            // Fetch user greeting only once (if not already loaded)
            if (!userGreeting.textContent.includes('@')) {
                await fetchUserDetails(session);
            }

            const { data: profile, error } = await supabasePending
                .from('profiles')
                .select('approval_status, role')
                .eq('id', session.user.id)
                .single();

            if (error) {
                logDebug(`Profile fetch error: ${error.message}`);
                if (isManual) redirectMsg.textContent = `Error: ${error.message}`;
                return;
            }

            if (!profile) {
                logDebug('Profile row missing – redirecting to complete-profile');
                window.location.href = './complete-profile.html';
                return;
            }

            logDebug(`Status: ${profile.approval_status} | Role: ${profile.role}`);

            if (profile.approval_status === 'approved') {
                statusBadge.textContent = '🟢 Approved';
                redirectMsg.textContent = '✅ Approved! Redirecting...';
                clearInterval(pollingInterval);
                setTimeout(() => {
                    window.location.href = (profile.role === 'admin') ? './admin/dashboard.html' : './dashboard.html';
                }, 1500);
            } else if (profile.approval_status === 'rejected') {
                statusBadge.textContent = '🔴 Rejected';
                redirectMsg.textContent = '❌ Your account has been rejected. Contact admin.';
                clearInterval(pollingInterval);
            } else {
                // still pending
                if (isManual) redirectMsg.textContent = 'Still waiting for admin approval.';
            }
        } catch (err) {
            logDebug(`Exception: ${err.message}`);
            if (isManual) redirectMsg.textContent = 'Something went wrong.';
        } finally {
            if (isManual) {
                checkBtn.disabled = false;
                btnText.style.display = 'inline';
                spinner.style.display = 'none';
            }
        }
    }

    function startPolling() {
        checkApprovalStatus(false);
        pollingInterval = setInterval(() => checkApprovalStatus(false), 5000);
    }

    document.addEventListener('DOMContentLoaded', () => {
        startPolling();
    });

    checkBtn.addEventListener('click', () => checkApprovalStatus(true));

    async function logout() {
        await supabasePending.auth.signOut();
        window.location.href = './login.html';
    }
</script>
</body>
</html>
