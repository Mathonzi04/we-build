<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | A+Connect</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .reset-card {
      background: white;
      max-width: 400px;
      width: 90%;
      padding: 2rem;
      border-radius: 32px;
      box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
    }
    .reset-card h2 {
      text-align: center;
      margin-bottom: 0.5rem;
      color: #1e293b;
    }
    .reset-card p {
      text-align: center;
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 1.5rem;
    }
    .reset-card input {
      width: 100%;
      padding: 0.8rem;
      margin: 0.5rem 0;
      border-radius: 40px;
      border: 1px solid #cbd5e1;
    }
    .reset-card button {
      width: 100%;
      background: #1e293b;
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
    }
    .message {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.8rem;
      color: #c2410c;
    }
    .success { color: #15803d; }
  </style>
</head>
<body>
<div class="reset-card">
  <h2>Set New Password</h2>
  <p>Enter your new password below.</p>
  <input type="password" id="newPassword" placeholder="New password" />
  <input type="password" id="confirmPassword" placeholder="Confirm new password" />
  <button id="resetBtn">Update Password</button>
  <div id="message" class="message"></div>
</div>

<script>
  (function() {
    const SUPABASE_URL = 'https://sdrwdvvrojhhxnyydsao.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkcndkdnZyb2poaHhueXlkc2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODQ3MTYsImV4cCI6MjA5NTQ2MDcxNn0.M67nknliCzw3EcfHM5EhbSxan1gedDmOVwsWOK4sYMM';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('resetBtn').addEventListener('click', async () => {
      const newPass = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;
      const msgDiv = document.getElementById('message');

      if (!newPass || !confirmPass) {
        msgDiv.innerText = 'Please fill in both fields.';
        return;
      }
      if (newPass !== confirmPass) {
        msgDiv.innerText = 'Passwords do not match.';
        return;
      }
      if (newPass.length < 6) {
        msgDiv.innerText = 'Password must be at least 6 characters.';
        return;
      }

      // Update the password – Supabase automatically uses the session from the URL hash
      const { data, error } = await supabase.auth.updateUser({ password: newPass });

      if (error) {
        msgDiv.innerText = error.message;
      } else {
        msgDiv.innerText = 'Password updated successfully! Redirecting to login...';
        msgDiv.className = 'message success';
        // After a short delay, redirect to login page
        setTimeout(() => {
          window.location.href = 'https://mathonzi04.github.io/we-build/login.html';
        }, 2000);
      }
    });
  })();
</script>
</body>
</html>
