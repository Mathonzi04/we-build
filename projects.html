<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects Portfolio | Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #f0f4f8; padding: 1.5rem; }
        .container { max-width: 1300px; margin: 0 auto; }
        .header { background: white; border-radius: 1rem; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        .logout-btn { background: #e53e3e; color: white; border: none; padding: 0.5rem 1.2rem; border-radius: 2rem; cursor: pointer; }
        .card { background: white; border-radius: 1rem; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .btn { background: #1e2a47; color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; margin: 0.2rem; }
        .btn-danger { background: #e53e3e; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 0.3rem; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.6rem; border: 1px solid #cbd5e0; border-radius: 0.5rem; }
        .image-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 0.5rem; }
        .image-preview { width: 100px; height: 100px; object-fit: cover; border-radius: 0.5rem; border: 1px solid #ccc; }
        .main-badge { background: #2f855a; color: white; padding: 0.2rem 0.4rem; border-radius: 0.3rem; font-size: 0.7rem; }
        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 1rem; }
        .project-card { background: #f7fafc; border-radius: 1rem; padding: 1rem; }
        .project-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 0.5rem; margin-bottom: 0.5rem; }
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-card { background: white; max-width: 600px; width: 90%; border-radius: 1rem; padding: 1.5rem; max-height: 80vh; overflow-y: auto; }
        .error-msg { color: #e53e3e; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2><i class="fas fa-folder-open"></i> Projects Portfolio</h2>
        <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
    <div class="card">
        <button id="addProjectBtn" class="btn"><i class="fas fa-plus"></i> Add New Project</button>
        <div id="projectsList" class="project-grid">Loading...</div>
    </div>
</div>

<!-- Modal for Add/Edit Project -->
<div id="projectModal" class="modal">
    <div class="modal-card">
        <h3 id="modalTitle">Add Project</h3>
        <div class="form-group"><label>Project Name *</label><input type="text" id="projectName"></div>
        <div class="form-group"><label>Type (e.g., E-commerce, Portfolio, SaaS)</label><input type="text" id="projectType"></div>
        <div class="form-group"><label>Price (USD)</label><input type="number" id="priceUSD" step="0.01"></div>
        <div class="form-group"><label>Price (ZAR)</label><input type="number" id="priceZAR" step="0.01"></div>
        <div class="form-group"><label>Description</label><textarea id="projectDesc" rows="3"></textarea></div>
        <div class="form-group"><label>Links / Options (comma separated URLs or text)</label><input type="text" id="projectLinks" placeholder="https://demo.com, https://github.com/..."></div>
        <div class="form-group"><label>Images (up to 3, first one is main)</label>
            <input type="file" id="img0" accept="image/*"><label>Main image</label>
            <input type="file" id="img1" accept="image/*"><label>Extra 1</label>
            <input type="file" id="img2" accept="image/*"><label>Extra 2</label>
        </div>
        <div id="imagePreviews" class="image-row"></div>
        <input type="hidden" id="editProjectId">
        <button id="saveProjectBtn" class="btn">Save</button>
        <button id="closeModalBtn" class="btn btn-danger">Cancel</button>
        <div id="modalMessage"></div>
    </div>
</div>

<script>
(function() {
    const SUPABASE_URL = 'https://sdrwdvvrojhhxnyydsao.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkcndkdnZyb2poaHhueXlkc2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODQ3MTYsImV4cCI6MjA5NTQ2MDcxNn0.M67nknliCzw3EcfHM5EhbSxan1gedDmOVwsWOK4sYMM';
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const LOGIN_URL = 'https://mathonzi04.github.io/we-build/login.html';

    async function checkAuth() {
        const { data: { session } } = await _supabase.auth.getSession();
        if (!session) window.location.href = LOGIN_URL;
    }

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    async function loadProjects() {
        const container = document.getElementById('projectsList');
        const { data, error } = await _supabase.from('projects').select('*').order('created_at', { ascending: false });
        if (error) { container.innerHTML = '<p class="error-msg">Error loading projects</p>'; return; }
        if (!data || data.length === 0) { container.innerHTML = '<p>No projects yet. Click "Add New Project".</p>'; return; }
        container.innerHTML = data.map(p => {
            const images = p.images || [];
            const mainImg = images[0] ? `<img src="${images[0]}" alt="${escapeHtml(p.title)}">` : '<i class="fas fa-image"></i>';
            return `
                <div class="project-card">
                    ${mainImg}
                    <h3>${escapeHtml(p.title)}</h3>
                    <p><strong>${escapeHtml(p.type || '')}</strong></p>
                    <p>USD $${p.price_usd || 0} / ZAR R${p.price_zar || 0}</p>
                    <p>${escapeHtml(p.description || '').substring(0, 80)}...</p>
                    <button class="edit-project btn" data-id="${p.id}">Edit</button>
                    <button class="delete-project btn btn-danger" data-id="${p.id}">Delete</button>
                </div>
            `;
        }).join('');
        document.querySelectorAll('.edit-project').forEach(btn => btn.addEventListener('click', () => openModal(btn.dataset.id)));
        document.querySelectorAll('.delete-project').forEach(btn => btn.addEventListener('click', async () => {
            if (confirm('Delete this project?')) {
                await _supabase.from('projects').delete().eq('id', btn.dataset.id);
                loadProjects();
            }
        }));
    }

    async function openModal(id = null) {
        document.getElementById('modalTitle').innerText = id ? 'Edit Project' : 'Add Project';
        document.getElementById('editProjectId').value = id || '';
        if (id) {
            const { data, error } = await _supabase.from('projects').select('*').eq('id', id).single();
            if (data) {
                document.getElementById('projectName').value = data.title || '';
                document.getElementById('projectType').value = data.type || '';
                document.getElementById('priceUSD').value = data.price_usd || '';
                document.getElementById('priceZAR').value = data.price_zar || '';
                document.getElementById('projectDesc').value = data.description || '';
                document.getElementById('projectLinks').value = (data.links || []).join(', ');
                // preview images
                const images = data.images || [];
                const previewDiv = document.getElementById('imagePreviews');
                previewDiv.innerHTML = '';
                images.forEach((img, idx) => {
                    const imgEl = document.createElement('img');
                    imgEl.src = img;
                    imgEl.className = 'image-preview';
                    if (idx === 0) imgEl.title = 'Main image';
                    previewDiv.appendChild(imgEl);
                });
            }
        } else {
            document.getElementById('projectName').value = '';
            document.getElementById('projectType').value = '';
            document.getElementById('priceUSD').value = '';
            document.getElementById('priceZAR').value = '';
            document.getElementById('projectDesc').value = '';
            document.getElementById('projectLinks').value = '';
            document.getElementById('imagePreviews').innerHTML = '';
            document.querySelectorAll('.projectImage').forEach(inp => inp.value = '');
        }
        document.getElementById('projectModal').style.display = 'flex';
    }

    async function saveProject() {
        const id = document.getElementById('editProjectId').value;
        const title = document.getElementById('projectName').value.trim();
        if (!title) { document.getElementById('modalMessage').innerHTML = '<span class="error-msg">Project name required</span>'; return; }
        const type = document.getElementById('projectType').value;
        const price_usd = parseFloat(document.getElementById('priceUSD').value) || 0;
        const price_zar = parseFloat(document.getElementById('priceZAR').value) || 0;
        const description = document.getElementById('projectDesc').value;
        const linksRaw = document.getElementById('projectLinks').value;
        const links = linksRaw.split(',').map(l => l.trim()).filter(l => l);
        // gather images (up to 3)
        const imageFiles = [];
        for (let i = 0; i <= 2; i++) {
            const inp = document.getElementById(`img${i}`);
            if (inp && inp.files && inp.files[0]) imageFiles.push(inp.files[0]);
        }
        let images = [];
        if (imageFiles.length > 0) {
            for (let file of imageFiles) {
                const reader = new FileReader();
                const base64 = await new Promise(resolve => { reader.onload = () => resolve(reader.result); reader.readAsDataURL(file); });
                images.push(base64);
            }
        } else if (id) {
            // keep existing images if not changed
            const { data } = await _supabase.from('projects').select('images').eq('id', id).single();
            if (data) images = data.images || [];
        }
        const projectData = { title, type, price_usd, price_zar, description, links, images };
        if (id) {
            await _supabase.from('projects').update(projectData).eq('id', id);
        } else {
            await _supabase.from('projects').insert(projectData);
        }
        document.getElementById('projectModal').style.display = 'none';
        loadProjects();
    }

    document.getElementById('addProjectBtn').addEventListener('click', () => openModal());
    document.getElementById('saveProjectBtn').addEventListener('click', saveProject);
    document.getElementById('closeModalBtn').addEventListener('click', () => document.getElementById('projectModal').style.display = 'none');
    document.getElementById('logoutBtn').addEventListener('click', async () => { await _supabase.auth.signOut(); window.location.href = LOGIN_URL; });
    checkAuth();
    loadProjects();
})();
</script>
</body>
</html>
